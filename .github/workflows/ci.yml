name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Prose-only changes (Markdown, LICENSE) skip the simulator suites. The verify jobs still run (and pass) so the
  # required checks report; only their steps are skipped.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=false
          while IFS= read -r file; do
            echo "$file"
            case "$file" in
              # Only prose: docs/testing/journeys.json is the runner's manifest, so it runs everything.
              *.md | LICENSE | "") ;;
              *) code=true ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          echo "code=$code" >> "$GITHUB_OUTPUT"

  verify:
    name: ${{ matrix.name }}
    needs: changes
    runs-on: ${{ needs.changes.outputs.code == 'true' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The `access` journey (large-text audit) never settles on the runner's iOS 26
        # simulators, so it runs only in the local `preinstall` gate on iOS 27.
        include:
          - name: core
            args: core
          - name: session
            args: session
          - name: ui-1
            args: ui --only modes --only mode-rejected --only mode-unconfirmed --only offline --only eq --only eqfail --only presets --only editor
          - name: ui-2
            args: ui --only swap --only unreachable --only settings --only firmware --only waiting --only firstrun --only invalid --only probe
    steps:
      - if: needs.changes.outputs.code == 'false'
        run: echo "Docs-only change; simulator suites skipped."
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v5
      - if: needs.changes.outputs.code == 'true'
        run: xcodebuild -version && xcrun simctl list runtimes available
      - if: needs.changes.outputs.code == 'true'
        run: ./scripts/verify.sh ${{ matrix.args }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.name }}
          path: build/Verification/
          if-no-files-found: ignore
