name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.lane }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [core, session, ui]
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version && xcrun simctl list runtimes available
      - run: ./scripts/verify.sh ${{ matrix.lane }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.lane }}
          path: build/Verification/
          if-no-files-found: ignore
